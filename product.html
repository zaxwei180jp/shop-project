<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-4 max-w-xl mx-auto">

<!-- Navbar -->
<div class="bg-white shadow sticky top-0 z-50">
  <div class="px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <button onclick="history.back()">←</button>
      <a href="index.html">商店</a>
    </div>
    <a href="cart.html" class="relative">
      🛒<span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs px-1 rounded-full">0</span>
    </a>
  </div>
</div>

<div id="app"></div>

<script type="module">
import { getProducts, formatPrice, addToCart, updateCartCount } from "/utils.js";

const id = new URLSearchParams(location.search).get("id");

let current = 0;
let p = null;

init();

async function init() {
  const products = await getProducts();
  updateCartCount();
  p = products.find(x => x.id === id);

  if (!p) return;

  render();
}

function render() {
  document.getElementById("app").innerHTML = `
    <div class="aspect-square">
      <img src="${(p.images && p.images[current]) || p.image}" class="w-full h-full object-cover"/>
    </div>

    <div class="flex gap-2 mt-2">
      ${(p.images || []).map((img,i)=>`
        <img src="${img}" data-i="${i}" class="thumb w-16 h-16 object-cover"/>
      `).join("")}
    </div>

    <h1 class="text-xl mt-3">${p.name}</h1>
    <p>${formatPrice(p.price)}</p>

    <div class="whitespace-pre-line mt-3">${p.description || ""}</div>

    <button data-id="${p.id}" class="add-btn w-full bg-black text-white py-3 mt-4">
      加入購物車
    </button>
  `;
}

document.addEventListener("click", e=>{
  if(e.target.classList.contains("thumb")){
    current = e.target.dataset.i;
    render();
  }
  if(e.target.classList.contains("add-btn")){
    addToCart(e.target.dataset.id);
    updateCartCount();
  }
});
</script>

</body>
</html>
