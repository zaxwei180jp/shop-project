<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-5">

<div id="app"></div>

<script type="module">
import { getProducts, formatPrice, addToCart } from "./utils.js";

const id = new URLSearchParams(location.search).get("id");
const products = await getProducts();
const p = products.find(x => x.id === id);

let current = 0;

function render() {
  document.getElementById("app").innerHTML = `
    <img src="${p.images[current] || p.image}" class="w-full h-60 object-cover"/>

    <div class="flex gap-2 mt-2">
      ${p.images.map((img,i)=>`
        <img src="${img}" onclick="sel(${i})" class="w-16 h-16 border cursor-pointer"/>
      `).join("")}
    </div>

    <h1 class="text-xl mt-3">${p.name}</h1>
    <p>${formatPrice(p.price)}</p>

    <button onclick="add('${p.id}')" class="bg-black text-white px-4 py-2 mt-3">
      加入購物車
    </button>
  `;
}

window.sel = (i)=>{ current=i; render(); }
window.add = addToCart;

render();
</script>
</body>
</html>
