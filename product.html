<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-4 max-w-xl mx-auto">

<div id="app">Loading...</div>

<script type="module">
import { getProducts, formatPrice, addToCart } from "/utils.js";

const id = new URLSearchParams(location.search).get("id");

let current = 0;
let p = null;

init();

async function init() {
  const products = await getProducts();
  p = products.find(x => x.id === id);

  if (!p) {
    document.body.innerHTML = "商品不存在";
    return;
  }

  render();
}

function render() {
  document.getElementById("app").innerHTML = `
    
    <!-- 主圖（正方形） -->
    <div class="w-full aspect-square overflow-hidden rounded-lg bg-gray-100">
      <img src="${(p.images && p.images[current]) || p.image}" 
           class="w-full h-full object-cover"/>
    </div>

    <!-- 小圖 -->
    <div class="flex gap-2 mt-3 overflow-x-auto">
      ${(p.images || []).map((img,i)=>`
        <img src="${img}" 
             data-i="${i}" 
             class="thumb w-16 h-16 object-cover border rounded cursor-pointer"/>
      `).join("")}
    </div>

    <!-- 商品資訊 -->
    <h1 class="text-xl md:text-2xl font-bold mt-4">${p.name}</h1>

    <p class="text-lg md:text-xl text-red-500 mt-2">
      ${formatPrice(p.price)}
    </p>

    <!-- 商品敘述（關鍵修正） -->
    <div class="mt-4 text-sm md:text-base leading-relaxed whitespace-pre-line text-gray-700">
      ${p.description || ""}
    </div>

    <!-- 按鈕 -->
    <button data-id="${p.id}" 
      class="add-btn w-full bg-black text-white py-3 rounded-lg mt-6 text-lg">
      加入購物車
    </button>
  `;
}

/* 事件 */
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("thumb")) {
    current = Number(e.target.dataset.i);
    render();
  }

  if (e.target.classList.contains("add-btn")) {
    addToCart(e.target.dataset.id);
  }
});
</script>

</body>
</html>
