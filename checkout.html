<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結帳</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="js/theme-premium.css">

<style>
body { background: var(--gray-100) !important; }
.checkout-wrap { max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 40px; display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>

<nav class="top-nav">
  <a href="cart.html" class="nav-icon-btn"><i class="ti ti-arrow-left"></i></a>
  <span style="font-size:16px;font-weight:600">結帳</span>
  <div style="width:44px"></div>
</nav>

<div class="checkout-wrap">

  <!-- 步驟指示 -->
  <div style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px">
    <span style="color:#aaa">購物車</span>
    <span style="color:#ddd">›</span>
    <span style="font-weight:700;color:#111;background:#111;color:#fff;padding:4px 12px;border-radius:20px">填寫資料</span>
    <span style="color:#ddd">›</span>
    <span style="color:#aaa">完成</span>
  </div>

  <!-- 訂單摘要 -->
  <div style="background:#fff;border-radius:16px;overflow:hidden">
    <button onclick="toggleSummary()" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px;background:transparent;border:none;cursor:pointer">
      <span style="font-size:15px;font-weight:700">📦 訂單明細</span>
      <span id="summaryArrow" style="color:#aaa;font-size:12px;transition:transform 0.2s">▼</span>
    </button>
    <div id="summaryContent" style="display:none;border-top:1px solid #f2f2f2;padding:12px 16px 16px">
      <div id="orderItems" style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px"></div>
      <div style="display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #f2f2f2">
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#666">
          <span>商品小計</span>
          <span id="orderSubtotal"></span>
        </div>
        <div id="orderDiscountRow" style="display:none;justify-content:space-between;font-size:13px;color:#059669">
          <span>🎉 滿NT$3,000折扣</span>
          <span>- NT$200</span>
        </div>
        <div id="orderShippingRow" style="display:flex;justify-content:space-between;font-size:13px;color:#666">
          <span>出貨手續費</span>
          <span id="orderShipping"></span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding:12px 14px;background:#111;border-radius:12px">
          <span style="font-size:14px;font-weight:700;color:#fff">總計</span>
          <span id="orderTotal" style="font-size:18px;font-weight:700;color:#f87171"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- 收件資料 -->
  <div style="background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px">
    <div style="font-size:15px;font-weight:700;margin-bottom:4px">收件資料</div>

    <div style="background:#f9f9f9;border-radius:12px;padding:14px 16px">
      <div style="font-size:11px;color:#aaa;font-weight:600;letter-spacing:0.5px;margin-bottom:6px">姓名 <span style="color:#e24b4a">*</span></div>
      <input id="name" type="text" placeholder="請輸入姓名" style="background:transparent;border:none;outline:none;font-size:16px;font-weight:500;color:#111;width:100%;padding:0">
    </div>

    <div style="background:#f9f9f9;border-radius:12px;padding:14px 16px">
      <div style="font-size:11px;color:#aaa;font-weight:600;letter-spacing:0.5px;margin-bottom:6px">電話 <span style="color:#e24b4a">*</span></div>
      <input id="phone" type="tel" placeholder="請輸入電話" style="background:transparent;border:none;outline:none;font-size:16px;font-weight:500;color:#111;width:100%;padding:0">
    </div>

    <div style="background:#f9f9f9;border-radius:12px;padding:14px 16px">
      <div style="font-size:11px;color:#aaa;font-weight:600;letter-spacing:0.5px;margin-bottom:6px">Email <span style="color:#e24b4a">*</span></div>
      <input id="email" type="email" placeholder="請輸入 Email" style="background:transparent;border:none;outline:none;font-size:16px;font-weight:500;color:#111;width:100%;padding:0">
    </div>

    <div style="background:#f9f9f9;border-radius:12px;padding:14px 16px">
      <div style="font-size:11px;color:#aaa;font-weight:600;letter-spacing:0.5px;margin-bottom:6px">地址 <span style="color:#e24b4a">*</span></div>
      <input id="address" type="text" placeholder="請輸入收件地址" style="background:transparent;border:none;outline:none;font-size:16px;font-weight:500;color:#111;width:100%;padding:0">
    </div>
  </div>

  <!-- 按鈕 -->
  <div style="display:flex;flex-direction:column;gap:8px">
    <button id="submitBtn" onclick="submitOrder()" style="width:100%;padding:18px;background:#111;color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer">
      確認送出訂單
    </button>
    <a href="cart.html" style="display:block;width:100%;padding:14px;background:#f9f9f9;color:#666;border:none;border-radius:14px;font-size:15px;font-weight:500;text-align:center;text-decoration:none">
      ← 回到購物車
    </a>
  </div>

  <p style="font-size:12px;text-align:center;color:#aaa">送出後將建立訂單，我們會盡快與您聯繫</p>

</div>

<!-- 成功畫面 -->
<div id="successScreen" style="display:none;position:fixed;inset:0;background:#f2f2f2;z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:24px">
  <div style="font-size:64px;margin-bottom:16px">🎉</div>
  <div style="font-size:24px;font-weight:700;margin-bottom:8px">訂單已送出！</div>
  <div style="font-size:14px;color:#aaa;margin-bottom:24px">感謝您的購買，我們將盡快與您聯繫</div>

  <div style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;margin-bottom:24px">
    <div style="background:#fff;border-radius:16px;padding:20px;text-align:center">
      <div style="font-size:11px;color:#aaa;font-weight:600;letter-spacing:0.5px;margin-bottom:8px">訂單編號</div>
      <div id="displayOrderId" style="font-size:22px;font-weight:700;color:#111;letter-spacing:2px"></div>
      <button onclick="copyOrderId()" style="margin-top:8px;font-size:12px;color:#aaa;background:none;border:none;cursor:pointer;text-decoration:underline">點擊複製</button>
    </div>
    <div style="background:#fff;border-radius:16px;padding:20px;text-align:center">
      <div style="font-size:11px;color:#aaa;font-weight:600;letter-spacing:0.5px;margin-bottom:8px">客戶編號</div>
      <div id="displayCustomerId" style="font-size:18px;font-weight:700;color:#1d4ed8"></div>
      <div style="font-size:12px;color:#aaa;margin-top:6px">下次購物可用此編號查詢訂單</div>
    </div>
  </div>

  <div style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px">
    <a id="queryLink" href="order-status.html" style="display:block;width:100%;padding:18px;background:#111;color:#fff;text-align:center;font-size:16px;font-weight:700;border-radius:14px;text-decoration:none">
      查詢訂單狀態
    </a>
    <a href="index.html" style="display:block;width:100%;padding:14px;background:#fff;color:#666;text-align:center;font-size:15px;font-weight:500;border-radius:14px;text-decoration:none">
      繼續逛逛
    </a>
  </div>
</div>

<script src="./js/cartCount.js"></script>
<script type="module">
import { formatPrice } from "./js/utils.js";

const PRODUCTS_API = "https://shop-project-azure.vercel.app/api/products";
const ORDERS_API   = "https://shop-project-azure.vercel.app/api/orders-manage";
const CUSTOMER_API = "https://shop-project-azure.vercel.app/api/customer";

const RATE       = 220;
const SURCHARGE  = 150;
const FREE_KG    = 10;

let orderItems    = [];
let orderTotal    = 0;
let orderSubtotal = 0;
let orderShipping = 0;
let orderDiscount = 0;

// ── 初始化：讀購物車 + 抓商品資料 ──────────────────────
async function init() {
  const cart = JSON.parse(localStorage.getItem("cart") || "{}");
  if (!Object.keys(cart).length) {
    location.href = "cart.html";
    return;
  }

  const res = await fetch(PRODUCTS_API, { cache: "no-store" });
  const products = await res.json();

  // ⭐ 優惠碼（要在使用前宣告）
  const COUPONS2       = { "hinamecute": { type: "jprice_rate", rate: 0.3 } };
  const couponCode2    = sessionStorage.getItem("appliedCoupon") || "";
  const activeCoupon   = COUPONS2[couponCode2] || null;

  orderItems    = [];
  orderSubtotal = 0;
  let totalWeight = 0;

  Object.entries(cart).forEach(([cartKey, qty]) => {
    const [id, variant] = cartKey.split(":");
    const p = products.find(x => x.id === id);
    if (!p) return;
    let unitPrice = p.price;
    if (activeCoupon?.type === "jprice_rate" && p.jprice) {
      unitPrice = Math.floor(p.jprice * activeCoupon.rate);
    }
    const sub  = unitPrice * qty;
    orderSubtotal += sub;
    totalWeight   += (p.weight || 0) * qty;
    const name = variant ? `${p.name}（${variant}）` : p.name;
    orderItems.push({ id, idnumber: p.idnumber || "", variant: variant || "", name, qty, price: unitPrice, sub });
  });


  // ⭐ 運費計算
  const FLAT_SHIPPING  = 200;
  const FREE_AMOUNT    = 5000;
  const DISCOUNT_MIN   = 3000;
  const DISCOUNT_AMT   = 200;

  // 滿 3000 折 200（hinamecute 不適用）
  orderDiscount         = (!activeCoupon && orderSubtotal >= DISCOUNT_MIN) ? DISCOUNT_AMT : 0;
  const afterDiscount   = orderSubtotal - orderDiscount;
  const isFreeShipping  = activeCoupon ? true : afterDiscount >= FREE_AMOUNT;
  orderShipping         = isFreeShipping ? 0 : FLAT_SHIPPING;
  orderTotal            = afterDiscount + orderShipping;

  // 訂單明細
  document.getElementById("orderItems").innerHTML = orderItems.map(i => `
    <div style="background:#f9f9f9;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:500;color:#111">${i.name}</div>
        <div style="font-size:12px;color:#aaa;margin-top:2px">× ${i.qty}</div>
      </div>
      <div style="font-size:15px;font-weight:700;color:#111;flex-shrink:0">${formatPrice(i.price * i.qty)}</div>
    </div>
  `).join("");

  document.getElementById("orderSubtotal").textContent = formatPrice(orderSubtotal);

  const shippingEl  = document.getElementById("orderShipping");
  const shippingRow = document.getElementById("orderShippingRow");

  if (orderDiscount > 0) {
    const discEl = document.getElementById("orderDiscountRow");
    if (discEl) discEl.style.display = "flex";
  }
  if (isFreeShipping) {
    shippingEl.textContent = "免出貨手續費";
    shippingRow.style.color = "#059669";
  } else {
    shippingEl.textContent = "NT$200";
    shippingRow.style.color = "#666";
  }

  document.getElementById("orderTotal").textContent = formatPrice(orderTotal);
}

// ── 展開 / 收合訂單明細 ──────────────────────────────
window.toggleSummary = () => {
  const content = document.getElementById("summaryContent");
  const arrow   = document.getElementById("summaryArrow");
  const isHidden = content.style.display === "none" || content.style.display === "";
  content.style.display = isHidden ? "block" : "none";
  arrow.style.transform = isHidden ? "rotate(180deg)" : "";
};

// ── 送出訂單 ─────────────────────────────────────────
window.submitOrder = async () => {
  const name    = document.getElementById("name").value.trim();
  const phone   = document.getElementById("phone").value.trim();
  const email   = document.getElementById("email").value.trim();
  const address = document.getElementById("address").value.trim();

  // 驗證
  if (!name || !phone || !email || !address) {
    alert("請填寫所有必填欄位（姓名、電話、Email、地址）");
    return;
  }
  if (!/^\d{8,10}$/.test(phone.replace(/-/g, ""))) {
    alert("電話格式不正確");
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert("Email 格式不正確");
    return;
  }

  const orderId = "ORD" + Date.now().toString().slice(-8);
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "確認客戶資料...";

  try {
    // ⭐ Step 1：查詢或建立客戶
    const isCouponOrder = sessionStorage.getItem("appliedCoupon") === "hinamecute";

    const custCheck = await fetch(
      CUSTOMER_API + "?email=" + encodeURIComponent(email)
    );
    const custData = await custCheck.json();

    let customerId;
    if (custData.found) {
      customerId = custData.customerId;
    } else {
      // hinamecute 用 C-161 開頭，尾數從 A 開始
      const prefix = isCouponOrder ? "C-161" : "W-82";
      const custCreate = await fetch(CUSTOMER_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, name, phone, address, prefix }),
      });
      const custCreated = await custCreate.json();
      if (!custCreated.customerId) throw new Error("客戶建立失敗");
      customerId = custCreated.customerId;
    }

    // ⭐ Step 2：建立訂單
    btn.textContent = "建立訂單...";
    const res = await fetch(ORDERS_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        orderId, customerId,
        items: orderItems,
        total: orderTotal,
        shipping: orderShipping,
        discount: orderDiscount,
      }),
    });

    const data = await res.json();
    if (!data.success) throw new Error(data.error || "送出失敗");

    localStorage.removeItem("cart");
    sessionStorage.removeItem("appliedCoupon");

    // ⭐ 寄送訂單通知
    try {
      fetch("https://shop-project-azure.vercel.app/api/send-notify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ orderId, customerId, total: orderTotal, items: orderItems }),
      });
    } catch {}

    // ⭐ 集運：更新所有選取訂單的 bundleId
    const bundleOrdersRaw = sessionStorage.getItem("bundleOrders");
    if (bundleOrdersRaw) {
      const bundleOrders = JSON.parse(bundleOrdersRaw);
      const bundleId = "BUNDLE" + Date.now().toString().slice(-8);
      // 更新所有集運訂單（含本筆）
      const patchPromises = bundleOrders.map(o =>
        fetch(ORDERS_API, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pageId: o.pageId, bundleId }),
        })
      );
      // 本筆訂單也標記 bundleId（需要 pageId，先查）
      await Promise.all(patchPromises);
      sessionStorage.removeItem("bundleOrders");
    }

    document.getElementById("displayOrderId").textContent = orderId;
    document.getElementById("displayCustomerId").textContent = customerId;
    document.getElementById("queryLink").href = "order-status.html?orderId=" + orderId;
    document.getElementById("successScreen").style.display="flex";

  } catch (err) {
    alert("訂單送出失敗，請稍後再試\n" + err.message);
    btn.disabled = false;
    btn.textContent = "確認送出訂單";
  }
};

// ── 複製訂單編號 ─────────────────────────────────────
window.copyOrderId = () => {
  const id = document.getElementById("displayOrderId").textContent;
  navigator.clipboard.writeText(id).then(() => alert("已複製訂單編號：" + id));
};

init();
</script>
<script>
// ── Navibar 搜尋共用 JS ───────────────────────────────
function toggleSearch() {
  const box = document.getElementById("searchBox");
  const isHidden = box.classList.contains("hidden");
  box.classList.toggle("hidden", !isHidden);
  box.classList.toggle("flex", isHidden);
  if (isHidden) {
    setTimeout(() => document.getElementById("navSearchInput").focus(), 50);
  } else {
    closeSearch();
  }
}

function closeSearch() {
  const box = document.getElementById("searchBox");
  box.classList.add("hidden");
  box.classList.remove("flex");
  document.getElementById("navSearchInput").value = "";
}

function onNavSearch(val) {
  if (typeof handleNavSearch === "function") {
    handleNavSearch(val);
  }
}

// 非首頁：組字完成或按 Enter 才跳到 search.html
document.addEventListener("DOMContentLoaded", () => {
  const input = document.getElementById("navSearchInput");
  if (!input) return;

  let isComposing = false;

  input.addEventListener("compositionstart", () => { isComposing = true; });
  input.addEventListener("compositionend",   () => {
    isComposing = false;
    // 組字完成後如果有值就跳頁
    const val = input.value.trim();
    if (val) {
      window.location.href = "search.html?q=" + encodeURIComponent(val);
    }
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !isComposing && input.value.trim()) {
      window.location.href = "search.html?q=" + encodeURIComponent(input.value.trim());
    }
  });
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeSearch();
});

document.addEventListener("click", (e) => {
  const wrap = document.getElementById("searchWrap");
  if (wrap && !wrap.contains(e.target) && dd && !dd.contains(e.target)) {
    closeSearch();
  }
});
</script>
</body>
