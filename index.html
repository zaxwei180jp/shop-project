<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

<div class="max-w-5xl mx-auto p-4">

  <!-- 標題 -->
  <h1 class="text-2xl md:text-3xl font-bold mb-4">商品列表</h1>

  <!-- 搜尋 -->
  <input 
    id="search" 
    placeholder="搜尋商品..." 
    class="w-full border rounded-lg p-3 mb-4 text-base"
  />

  <!-- 商品列表 -->
  <div id="list" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>

</div>

<script type="module">
import { getProducts, formatPrice, addToCart } from "/utils.js";

const list = document.getElementById("list");
const search = document.getElementById("search");

let products = [];

init();

async function init() {
  products = await getProducts();

  if (!products.length) {
    list.innerHTML = "沒有商品";
    return;
  }

  render();
}

function render() {
  const s = search.value.toLowerCase();

  const filtered = products.filter(p =>
    (p.name || "").toLowerCase().includes(s)
  );

  list.innerHTML = filtered.map(p => `
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">

      <!-- 圖片（正方形） -->
      <a href="product.html?id=${p.id}">
        <div class="aspect-square bg-gray-100">
          <img src="${p.image}" class="w-full h-full object-cover"/>
        </div>
      </a>

      <!-- 內容 -->
      <div class="p-3">

        <a href="product.html?id=${p.id}">
          <h2 class="text-sm md:text-base font-medium line-clamp-2">
            ${p.name}
          </h2>
        </a>

        <p class="text-red-500 text-base md:text-lg font-semibold mt-1">
          ${formatPrice(p.price)}
        </p>

        <button 
          data-id="${p.id}" 
          class="add-btn w-full bg-black text-white py-2 rounded-lg mt-2 text-sm md:text-base">
          加入購物車
        </button>

      </div>

    </div>
  `).join("");
}

/* 加入購物車 */
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("add-btn")) {
    addToCart(e.target.dataset.id);
  }
});

search.oninput = render;
</script>

</body>
</html>
