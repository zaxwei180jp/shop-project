<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-5">

<h1 class="text-2xl mb-4">商品列表</h1>

<input id="search" placeholder="搜尋..." class="border p-2 mb-3 w-full"/>

<div id="list" class="grid grid-cols-2 gap-4"></div>

<script type="module">
import { getProducts, formatPrice, addToCart } from "./utils.js";

const list = document.getElementById("list");
const search = document.getElementById("search");

let products = [];

init();

async function init() {
  products = await getProducts();

  if (!products.length) {
    list.innerHTML = "沒有資料";
    return;
  }

  render();
}

function render() {
  const s = search.value.toLowerCase();

  const filtered = products.filter(p =>
    (p.name || "").toLowerCase().includes(s)
  );

  list.innerHTML = filtered.map(p => `
    <div class="border p-2">
      <a href="product.html?id=${p.id}">
        <img src="${p.image}" class="h-40 w-full object-cover"/>
        <h2>${p.name}</h2>
      </a>
      <p>${formatPrice(p.price)}</p>
      <button data-id="${p.id}" class="add-btn bg-black text-white px-2 py-1 mt-2">
        加入
      </button>
    </div>
  `).join("");
}

/* ✅ 事件代理（避免 Safari 爆） */
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("add-btn")) {
    addToCart(e.target.dataset.id);
  }
});

search.oninput = render;
</script>

</body>
</html>
