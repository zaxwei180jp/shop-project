<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-5">

<h1 class="text-2xl mb-4">商品列表</h1>

<input id="search" placeholder="搜尋..." class="border p-2 mb-3 w-full"/>

<select id="category" class="border p-2 mb-3">
  <option value="">全部分類</option>
</select>

<div id="list" class="grid grid-cols-2 gap-4"></div>

<script type="module">
import { getProducts, formatPrice, addToCart } from "./utils.js";

const list = document.getElementById("list");
const search = document.getElementById("search");
const category = document.getElementById("category");

let products = await getProducts();

/* 分類 */
[...new Set(products.map(p => p.category))].forEach(c=>{
  const op = document.createElement("option");
  op.value = c;
  op.textContent = c;
  category.appendChild(op);
});

function render() {
  const s = search.value.toLowerCase();
  const c = category.value;

  const filtered = products.filter(p =>
    p.name.toLowerCase().includes(s) &&
    (!c || p.category === c)
  );

  list.innerHTML = filtered.map(p => `
    <div class="border p-2">
      <img src="${p.image}" class="h-40 w-full object-cover"/>
      <h2>${p.name}</h2>
      <p>${formatPrice(p.price)}</p>
      <button onclick="add('${p.id}')" class="bg-black text-white px-2 py-1 mt-2">
        加入
      </button>
    </div>
  `).join("");
}

window.add = addToCart;

search.oninput = render;
category.onchange = render;

render();
</script>
</body>
</html>
