<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-5">

<h1 class="text-xl mb-4">購物車</h1>
<div id="cart"></div>

<button onclick="clear()" class="mt-4 bg-red-500 text-white px-3 py-2">
清空購物車
</button>

<script type="module">
import {
  getProducts, getCart, formatPrice,
  updateQty, removeItem, clearCart
} from "./utils.js";

const products = await getProducts();

function render() {
  const cart = getCart();

  let total = 0;

  const html = Object.entries(cart).map(([id, qty]) => {
    const p = products.find(x=>x.id===id);
    const sub = p.price * qty;
    total += sub;

    return `
      <div class="flex justify-between border-b py-2">
        <div>
          <h2>${p.name}</h2>
          <p>${formatPrice(sub)}</p>
        </div>

        <div>
          <button onclick="dec('${id}')">-</button>
          ${qty}
          <button onclick="inc('${id}')">+</button>
          <button onclick="del('${id}')" class="text-red-500">刪</button>
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("cart").innerHTML = html + `
    <h2 class="mt-4 text-xl">總計：${formatPrice(total)}</h2>
  `;
}

window.inc = (id)=>{ updateQty(id,1); render(); }
window.dec = (id)=>{ updateQty(id,-1); render(); }
window.del = (id)=>{ removeItem(id); render(); }
window.clear = ()=>{ clearCart(); render(); }

render();
</script>
</body>
</html>
