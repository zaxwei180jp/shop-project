<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-5">

<h1 class="text-xl mb-4">購物車</h1>

<div id="cart">Loading...</div>

<button id="clear" class="mt-4 bg-red-500 text-white px-3 py-2">
清空購物車
</button>

<script type="module">
import {
  getProducts,
  getCart,
  formatPrice,
  updateQty,
  removeItem,
  clearCart
} from "/utils.js";

let products = [];

init();

async function init() {
  products = await getProducts();
  render();
}

function render() {
  const cart = getCart();

  if (!Object.keys(cart).length) {
    document.getElementById("cart").innerHTML = "購物車是空的";
    return;
  }

  let total = 0;

  const html = Object.entries(cart).map(([id, qty]) => {
    const p = products.find(x => x.id === id);
    if (!p) return "";

    const sub = p.price * qty;
    total += sub;

    return `
      <div class="flex justify-between border-b py-3">
        <div>
          <h2 class="font-bold">${p.name}</h2>
          <p>${formatPrice(sub)}</p>
        </div>

        <div class="flex items-center gap-2">
          <button data-id="${id}" data-act="dec" class="px-2 border">-</button>
          <span>${qty}</span>
          <button data-id="${id}" data-act="inc" class="px-2 border">+</button>
          <button data-id="${id}" data-act="del" class="text-red-500 ml-2">刪除</button>
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("cart").innerHTML = `
    ${html}
    <div class="mt-4 text-xl font-bold">
      總計：${formatPrice(total)}
    </div>
  `;
}

/* 事件代理 */
document.addEventListener("click", (e) => {
  const id = e.target.dataset.id;
  const act = e.target.dataset.act;

  if (!id) return;

  if (act === "inc") updateQty(id, 1);
  if (act === "dec") updateQty(id, -1);
  if (act === "del") removeItem(id);

  render();
});

/* 清空 */
document.getElementById("clear").onclick = () => {
  clearCart();
  render();
};
</script>

</body>
</html>
