<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-4 max-w-xl mx-auto">

<!-- Navbar -->
<div class="bg-white shadow sticky top-0 z-50">
  <div class="px-4 py-3 flex justify-between">
    <a href="index.html">商店</a>
    <span id="cart-count">0</span>
  </div>
</div>

<h1 class="text-xl my-4">購物車</h1>

<div id="cart"></div>

<script type="module">
import { getProducts, getCart, updateQty, removeItem, clearCart, formatPrice, updateCartCount } from "/utils.js";

let products = [];

init();

async function init(){
  products = await getProducts();
  updateCartCount();
  render();
}

function render(){
  const cart = getCart();
  let total = 0;

  const html = Object.entries(cart).map(([id,qty])=>{
    const p = products.find(x=>x.id===id);
    if(!p) return "";

    const sub = p.price * qty;
    total += sub;

    return `
      <div class="flex justify-between border-b py-2">
        <div>${p.name}</div>
        <div>
          <button data-id="${id}" data-act="dec">-</button>
          ${qty}
          <button data-id="${id}" data-act="inc">+</button>
          <button data-id="${id}" data-act="del">刪</button>
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("cart").innerHTML =
    html + `<h2>總計：${formatPrice(total)}</h2>`;
}

document.addEventListener("click", e=>{
  const id = e.target.dataset.id;
  const act = e.target.dataset.act;

  if(!id) return;

  if(act==="inc") updateQty(id,1);
  if(act==="dec") updateQty(id,-1);
  if(act==="del") removeItem(id);

  render();
});
</script>

</body>
</html>
